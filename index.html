<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小布施町消防団 出席簿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                    <h1>消防団 出席簿</h1>
                    <span id="sync-status" class="sync-status"></span>
                </div>
                <div class="header-actions">
                    <button id="btn-export" class="btn btn-secondary btn-sm">エクスポート</button>
                    <label for="import-file" class="btn btn-secondary btn-sm">インポート</label>
                    <input type="file" id="import-file" accept=".json" style="display:none;">
                </div>
            </div>
        </header>

        <main id="main-content">
            <div class="table-container">
                <table id="attendance-table">
                    <thead>
                        <tr id="row-dates">
                            <!-- Dates header will be injected here -->
                        </tr>
                        <tr id="row-contents">
                            <!-- Contents header will be injected here -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Members rows will be injected here -->
                    </tbody>
                </table>
            </div>
            
            <div class="controls-container">
                <p class="help-text">※ セルをタップすると 空白 → 〇 → × と切り替わります。</p>
                <p class="help-text">※ 日付、内容、団員名をタップすると編集できます。</p>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="app.js?v=2"></script>
</body>
</html>
