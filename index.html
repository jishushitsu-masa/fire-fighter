<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小布施町消防団 出席簿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                    <h1>消防団 出席簿</h1>
                </div>
            </div>
        </header>

        <main id="main-content">
            <!-- Home View (List) -->
            <section id="view-home" class="view active">
                <div class="home-actions">
                    <button id="btn-new" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        新規活動を登録
                    </button>
                    <div class="sync-actions">
                        <button id="btn-export" class="btn btn-secondary btn-sm">エクスポート</button>
                        <label for="import-file" class="btn btn-secondary btn-sm">インポート</label>
                        <input type="file" id="import-file" accept=".json" style="display:none;">
                    </div>
                </div>

                <div class="history-section">
                    <h2>活動履歴</h2>
                    <div id="history-list" class="history-list">
                        <!-- History items will be generated by JS -->
                    </div>
                </div>
            </section>

            <!-- Form View (Add / Edit) -->
            <section id="view-form" class="view">
                <div class="form-header">
                    <button id="btn-back" class="btn btn-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <h2 id="form-title">新規登録</h2>
                    <div style="width: 44px;"></div> <!-- Spacer -->
                </div>

                <form id="attendance-form" class="attendance-form">
                    <input type="hidden" id="record-id">
                    
                    <div class="form-group">
                        <label for="date-input">活動日</label>
                        <input type="date" id="date-input" required>
                    </div>

                    <div class="form-group">
                        <label for="content-input">活動内容</label>
                        <input type="text" id="content-input" placeholder="例：定期巡回、技術大会の練習" required>
                    </div>

                    <div class="members-section">
                        <div class="members-header">
                            <h3>出欠入力</h3>
                            <div class="members-stats">
                                <span id="attend-count">出席: 0名</span>
                            </div>
                        </div>
                        
                        <div class="bulk-actions">
                            <button type="button" id="btn-all-attend" class="btn btn-outline btn-sm">全員出席</button>
                            <button type="button" id="btn-all-absent" class="btn btn-outline btn-sm">全員欠席</button>
                        </div>

                        <div id="members-list" class="members-list">
                            <!-- Member items will be generated by JS -->
                        </div>
                    </div>

                    <div class="form-actions-bottom">
                        <button type="submit" class="btn btn-primary btn-large">保存する</button>
                        <button type="button" id="btn-delete" class="btn btn-danger btn-large hidden">削除する</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
